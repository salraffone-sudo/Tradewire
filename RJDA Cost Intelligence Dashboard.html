-direction:column;grid-template-columns:none;padding:12px 14px;flex:none;}\n  .chart-card{height:380px;flex-shrink:0;}\n  .modal-box.detail-box,.modal-box.edit-box{width:95vw;max-height:90vh;}\n  .modal-box.chart-box{width:96vw;height:85vh;}\n  .form-grid{grid-template-columns:1fr;}\n  .project-table{overflow-x:auto;}\n  table{min-width:760px;}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ── STICKY CHROME ── -->\n<div id=\"appChrome\">\n  <div id=\"topBar\">\n    <!-- logo injected by JS -->\n    <div id=\"logoWrap\"><\u002Fdiv>\n    <div>\n      <div style=\"display:flex;align-items:baseline;gap:8px;\">\n        <h1>Cost Intelligence Dashboard<\u002Fh1>\n        <span class=\"subtitle\">RJ Development + Advisors<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"spacer\"><\u002Fdiv>\n    <div class=\"tabs\">\n      <button class=\"tab active\" data-tab=\"dashboardTab\">Dashboard<\u002Fbutton>\n      <button class=\"tab\" data-tab=\"addTab\">Add Project<\u002Fbutton>\n      <button class=\"tab\" data-tab=\"projectsTab\">All Projects<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"filterBar\">\n    <!-- Filters injected by JS -->\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ── APP BODY ── -->\n<div id=\"appBody\">\n\n  <!-- DASHBOARD TAB -->\n  <div id=\"dashboardTab\" class=\"tab-content active\" style=\"height:100%;\">\n    <div id=\"metricsStrip\"><\u002Fdiv>\n    <div id=\"chartsArea\">\n      <div class=\"chart-card\">\n        <div class=\"chart-header\">\n          <div>\n            <div class=\"chart-title\">Cost Distribution $/SF<\u002Fdiv>\n            <div class=\"chart-subtitle\">Grouped by project type · opacity = data reliability<\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"chart-expand\" onclick=\"expandChart('cost')\">⤢ Expand<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"chart-body\"><canvas id=\"costChart\"><\u002Fcanvas><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"chart-card\">\n        <div class=\"chart-header\">\n          <div>\n            <div class=\"chart-title\">Cost Trends &amp; Escalation<\u002Fdiv>\n            <div class=\"chart-subtitle\">Scatter · mean line per type · Construction Index escalation trajectory<\u002Fdiv>\n          <\u002Fdiv>\n          <button class=\"chart-expand\" onclick=\"expandChart('trend')\">⤢ Expand<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"chart-body\"><canvas id=\"trendChart\"><\u002Fcanvas><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ADD PROJECT TAB -->\n  <div id=\"addTab\" class=\"tab-content\">\n    <div class=\"page-body\">\n      <div class=\"info-msg\"><strong>Flexible Entry:<\u002Fstrong> Only Name, Location, SF, one cost figure, Date, and Reliability are required.<\u002Fdiv>\n      <form id=\"projectForm\" onsubmit=\"handleSubmit(event)\">\n        <div class=\"form-grid\">\n          <!-- Essential -->\n          <div class=\"form-section\">\n            <h3>Essential Data<\u002Fh3>\n            <div class=\"form-group\"><label>Project Name *<\u002Flabel><input type=\"text\" name=\"projectName\" required=\"\"><\u002Fdiv>\n            <div class=\"form-group\"><label>Location *<\u002Flabel><input type=\"text\" name=\"location\" required=\"\"><\u002Fdiv>\n            <div class=\"form-group\"><label>Square Footage *<\u002Flabel><input type=\"number\" name=\"squareFootage\" id=\"addSF\" required=\"\" oninput=\"recalcDerived()\"><\u002Fdiv>\n            <div class=\"form-group\"><label>Units <em style=\"font-weight:400;color:var(--muted-fg)\">(optional)<\u002Fem><\u002Flabel><input type=\"number\" name=\"units\" id=\"addUnits\" oninput=\"recalcDerived()\"><\u002Fdiv>\n            <div class=\"form-group\"><label>Date *<\u002Flabel><input type=\"date\" name=\"date\" required=\"\"><\u002Fdiv>\n            <div class=\"form-group\"><label>Source<\u002Flabel><input type=\"text\" name=\"source\" placeholder=\"e.g. RJDA records, GC estimate\"><\u002Fdiv>\n            <div class=\"form-group\"><label>Builder / GC<\u002Flabel><input type=\"text\" name=\"builder\"><\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Costs -->\n          <div class=\"form-section\">\n            <h3>Cost Data<\u002Fh3>\n            <div class=\"form-group\">\n              <label>Entry Method *<\u002Flabel>\n              <div class=\"form-toggle\">\n                <label><input type=\"radio\" name=\"costMethod\" value=\"total\" checked=\"\" onchange=\"switchCostMethod()\"> Total<\u002Flabel>\n                <label><input type=\"radio\" name=\"costMethod\" value=\"perSF\" onchange=\"switchCostMethod()\"> $/SF<\u002Flabel>\n                <label><input type=\"radio\" name=\"costMethod\" value=\"perUnit\" onchange=\"switchCostMethod()\"> $/Unit<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"costInputTotal\" class=\"form-group\"><label>Total Hard Cost ($) *<\u002Flabel><input type=\"number\" name=\"totalCost\" id=\"inputTotalCost\" oninput=\"recalcDerived()\"><\u002Fdiv>\n            <div id=\"costInputPerSF\" class=\"form-group\" style=\"display:none\"><label>Cost $/SF *<\u002Flabel><input type=\"number\" step=\".01\" name=\"directCostPerSF\" id=\"inputDirectSF\" oninput=\"recalcDerived()\"><\u002Fdiv>\n            <div id=\"costInputPerUnit\" class=\"form-group\" style=\"display:none\"><label>Cost $/Unit *<\u002Flabel><input type=\"number\" step=\".01\" name=\"directCostPerUnit\" id=\"inputDirectUnit\" oninput=\"recalcDerived()\"><\u002Fdiv>\n            <div id=\"derivedDisplay\" style=\"display:none;background:var(--muted);border-radius:7px;padding:10px;font-size:12px;margin-top:6px;\">\n              <div style=\"color:var(--muted-fg);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;\">Auto-Calculated<\u002Fdiv>\n              <div style=\"display:flex;gap:20px;\">\n                <div><span style=\"color:var(--muted-fg);\">$/SF<\u002Fspan><br><strong id=\"calcSF\">—<\u002Fstrong><\u002Fdiv>\n                <div><span style=\"color:var(--muted-fg);\">$/Unit<\u002Fspan><br><strong id=\"calcUnit\">—<\u002Fstrong><\u002Fdiv>\n                <div><span style=\"color:var(--muted-fg);\">Total<\u002Fspan><br><strong id=\"calcTotal\">—<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <input type=\"hidden\" name=\"costPerSF\" id=\"hidCostPerSF\">\n            <input type=\"hidden\" name=\"costPerUnit\" id=\"hidCostPerUnit\">\n\n            <div class=\"form-group\" style=\"margin-top:12px;\">\n              <label>Milestone <em style=\"font-weight:400;color:var(--muted-fg)\">(optional)<\u002Fem><\u002Flabel>\n              <div class=\"form-toggle\">\n                <label><input type=\"radio\" name=\"milestone\" value=\"\"> None<\u002Flabel>\n                <label><input type=\"radio\" name=\"milestone\" value=\"DD\"> DD<\u002Flabel>\n                <label><input type=\"radio\" name=\"milestone\" value=\"CD\"> CD/GMP<\u002Flabel>\n                <label><input type=\"radio\" name=\"milestone\" value=\"Final\"> Final/Actual<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"form-group\">\n              <label>Costs Adjusted?<\u002Flabel>\n              <div class=\"form-toggle\">\n                <label><input type=\"radio\" name=\"isAdjusted\" value=\"no\" checked=\"\" onchange=\"toggleAdj()\"> No<\u002Flabel>\n                <label><input type=\"radio\" name=\"isAdjusted\" value=\"yes\" onchange=\"toggleAdj()\"> Yes<\u002Flabel>\n                <label><input type=\"radio\" name=\"isAdjusted\" value=\"unknown\" onchange=\"toggleAdj()\"> Unknown<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"adjFields\" style=\"display:none;\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n                <div class=\"form-group\"><label>OH&amp;P ($)<\u002Flabel><input type=\"number\" name=\"ohp\" placeholder=\"0\"><\u002Fdiv>\n                <div class=\"form-group\"><label>Sitework ($)<\u002Flabel><input type=\"number\" name=\"sitework\" placeholder=\"0\"><\u002Fdiv>\n                <div class=\"form-group\"><label>Landscape ($)<\u002Flabel><input type=\"number\" name=\"landscape\" placeholder=\"0\"><\u002Fdiv>\n                <div class=\"form-group\"><label>Sub Bond ($)<\u002Flabel><input type=\"number\" name=\"subcontractorBond\" placeholder=\"0\"><\u002Fdiv>\n                <div class=\"form-group\"><label>Insurance ($)<\u002Flabel><input type=\"number\" name=\"insurance\" placeholder=\"0\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Classification + Reliability -->\n          <div class=\"form-section\">\n            <h3>Classification &amp; Reliability<\u002Fh3>\n\n            <!-- RELIABILITY TIER -->\n            <div class=\"form-group\">\n              <label>Data Reliability Tier *<\u002Flabel>\n              <div class=\"rel-select\" id=\"reliabilitySelect\">\n                <label class=\"rel-option confirmed-opt\">\n                  <input type=\"radio\" name=\"reliabilityTier\" value=\"confirmed\" required=\"\">\n                  <span class=\"rel-swatch\"><\u002Fspan> Confirmed\n                <\u002Flabel>\n                <label class=\"rel-option reliable-opt\">\n                  <input type=\"radio\" name=\"reliabilityTier\" value=\"reliable\">\n                  <span class=\"rel-swatch\"><\u002Fspan> Reliable\n                <\u002Flabel>\n                <label class=\"rel-option speculative-opt\">\n                  <input type=\"radio\" name=\"reliabilityTier\" value=\"speculative\">\n                  <span class=\"rel-swatch\"><\u002Fspan> Speculative\n                <\u002Flabel>\n                <label class=\"rel-option industry-opt\">\n                  <input type=\"radio\" name=\"reliabilityTier\" value=\"industry\">\n                  <span class=\"rel-swatch\"><\u002Fspan> Industry\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div style=\"margin-top:7px;font-size:11px;color:var(--muted-fg);line-height:1.5;\">\n                <strong style=\"color:#f87171;\">Confirmed<\u002Fstrong> — built/actual cost &nbsp;·&nbsp;\n                <strong style=\"color:#fbbf24;\">Reliable<\u002Fstrong> — priced at DD/CD &nbsp;·&nbsp;\n                <strong style=\"color:#9ca3af;\">Speculative<\u002Fstrong> — early design / 3rd party &nbsp;·&nbsp;\n                <strong style=\"color:#6b7280;\">Industry<\u002Fstrong> — external dataset\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"form-group\">\n              <label>Mark as Outlier<\u002Flabel>\n              <label class=\"outlier-toggle\" id=\"addOutlierToggle\">\n                <input type=\"checkbox\" name=\"isOutlier\" id=\"addOutlierCheck\">\n                Flag as outlier (excluded from averages)\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div class=\"form-group\"><label>Business Line<\u002Flabel>\n              <select name=\"businessLine\"><option value=\"\">Unspecified<\u002Foption><option value=\"advisory\">Advisory<\u002Foption><option value=\"investment\">Investment<\u002Foption><option value=\"deal-flow\">Deal Flow<\u002Foption><option value=\"competitor\">Competitor<\u002Foption><\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"form-group\"><label>Project Type<\u002Flabel>\n              <select name=\"projectType\"><option value=\"\">Unspecified<\u002Foption><option value=\"multi-family-podium\">Multi-Family Podium<\u002Foption><option value=\"multi-family-non-podium\">Multi-Family Non-Podium<\u002Foption><option value=\"healthcare\">Healthcare<\u002Foption><option value=\"research\">Research<\u002Foption><option value=\"parking\">Parking<\u002Foption><option value=\"commercial\">Commercial<\u002Foption><\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"form-group\"><label>Construction Type<\u002Flabel>\n              <select name=\"constructionType\"><option value=\"\">Unspecified<\u002Foption><option value=\"type-1\">Type 1<\u002Foption><option value=\"type-2\">Type 2<\u002Foption><option value=\"type-3\">Type 3<\u002Foption><option value=\"type-4\">Type 4<\u002Foption><option value=\"type-5\">Type 5<\u002Foption><\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"form-group\"><label>Notes<\u002Flabel><textarea name=\"notes\" placeholder=\"Anything relevant\"><\u002Ftextarea><\u002Fdiv>\n\n            <!-- CSI Breakdown (optional) -->\n            <div class=\"collapsible\">\n              <div class=\"collapsible-head\" onclick=\"toggleCollapsible(this)\">CSI Division Breakdown <span>▸<\u002Fspan><\u002Fdiv>\n              <div class=\"collapsible-body\">\n                <p style=\"font-size:11px;color:var(--muted-fg);margin-bottom:10px;\">Enter $/SF for each division (optional). These populate the project detail view.<\u002Fp>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n                  <div class=\"form-group\"><label>Div 01 — General Req.<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi01\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 03 — Concrete<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi03\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 04 — Masonry<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi04\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 05 — Metals<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi05\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 06 — Wood &amp; Plastics<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi06\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 07 — Thermal / Moisture<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi07\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 08 — Openings<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi08\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 09 — Finishes<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi09\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 14 — Conveying<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi14\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 21-22 — Fire / Plumbing<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi21\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 23 — HVAC<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi23\"><\u002Fdiv>\n                  <div class=\"form-group\"><label>Div 26 — Electrical<\u002Flabel><input type=\"number\" step=\".01\" name=\"csi26\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;\">\n          <button type=\"submit\" class=\"primary\">Add Project<\u002Fbutton>\n          <button type=\"button\" class=\"secondary\" onclick=\"resetAddForm()\">Clear<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ALL PROJECTS TAB -->\n  <div id=\"projectsTab\" class=\"tab-content\">\n    <div class=\"page-body\">\n      <div class=\"project-table\">\n        <table>\n          <thead><tr>\n            <th>Project<\u002Fth><th>Location<\u002Fth><th>Business Line<\u002Fth><th>Type<\u002Fth>\n            <th>SF<\u002Fth><th>Units<\u002Fth><th>$/SF<\u002Fth><th>$/Unit<\u002Fth>\n            <th>Reliability<\u002Fth><th>Outlier<\u002Fth><th>Actions<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody id=\"projectsBody\"><\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- end appBody -->\n\n<!-- ── MODALS ── -->\n\n<!-- Project Detail Modal -->\n<div id=\"detailModal\" class=\"modal\" onclick=\"if(event.target===this)closeModal('detailModal')\">\n  <div class=\"modal-box detail-box\">\n    <div class=\"modal-header\">\n      <h2 id=\"detailTitle\">Project Detail<\u002Fh2>\n      <button class=\"modal-close\" onclick=\"closeModal('detailModal')\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\" id=\"detailBody\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Chart Expand Modal -->\n<div id=\"chartModal\" class=\"modal\" onclick=\"if(event.target===this)closeModal('chartModal')\">\n  <div class=\"modal-box chart-box\">\n    <div class=\"modal-header\">\n      <h2 id=\"chartModalTitle\">Chart<\u002Fh2>\n      <button class=\"modal-close\" onclick=\"closeModal('chartModal')\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\" style=\"padding:16px;\">\n      <canvas id=\"expandedChart\"><\u002Fcanvas>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Edit Project Modal -->\n<div id=\"editModal\" class=\"modal\" onclick=\"if(event.target===this)closeModal('editModal')\">\n  <div class=\"modal-box edit-box\">\n    <div class=\"modal-header\">\n      <h2>Edit Project<\u002Fh2>\n      <button class=\"modal-close\" onclick=\"closeModal('editModal')\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <form id=\"editForm\" onsubmit=\"saveEdit(event)\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n          <div class=\"form-group\"><label>Project Name<\u002Flabel><input type=\"text\" name=\"projectName\" id=\"eProjectName\"><\u002Fdiv>\n          <div class=\"form-group\"><label>Location<\u002Flabel><input type=\"text\" name=\"location\" id=\"eLocation\"><\u002Fdiv>\n          <div class=\"form-group\"><label>Business Line<\u002Flabel>\n            <select name=\"businessLine\" id=\"eBusinessLine\"><option value=\"\">Unspecified<\u002Foption><option value=\"advisory\">Advisory<\u002Foption><option value=\"investment\">Investment<\u002Foption><option value=\"deal-flow\">Deal Flow<\u002Foption><option value=\"competitor\">Competitor<\u002Foption><\u002Fselect>\n          <\u002Fdiv>\n          <div class=\"form-group\"><label>Source<\u002Flabel><input type=\"text\" name=\"source\" id=\"eSource\"><\u002Fdiv>\n          <div class=\"form-group\" style=\"grid-column:1/-1\"><label>Notes<\u002Flabel><textarea name=\"notes\" id=\"eNotes\"><\u002Ftextarea><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"section-head\">Data Reliability Tier<\u002Fdiv>\n        <div class=\"rel-select\" id=\"editReliabilitySelect\">\n          <label class=\"rel-option confirmed-opt\"><input type=\"radio\" name=\"reliabilityTier\" value=\"confirmed\"> <span class=\"rel-swatch\"><\u002Fspan> Confirmed<\u002Flabel>\n          <label class=\"rel-option reliable-opt\"><input type=\"radio\" name=\"reliabilityTier\" value=\"reliable\"> <span class=\"rel-swatch\"><\u002Fspan> Reliable<\u002Flabel>\n          <label class=\"rel-option speculative-opt\"><input type=\"radio\" name=\"reliabilityTier\" value=\"speculative\"> <span class=\"rel-swatch\"><\u002Fspan> Speculative<\u002Flabel>\n          <label class=\"rel-option industry-opt\"><input type=\"radio\" name=\"reliabilityTier\" value=\"industry\"> <span class=\"rel-swatch\"><\u002Fspan> Industry<\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--muted-fg);margin-top:7px;line-height:1.5;\">\n          <strong style=\"color:#f87171;\">Confirmed<\u002Fstrong> — built/actual &nbsp;·&nbsp;\n          <strong style=\"color:#fbbf24;\">Reliable<\u002Fstrong> — DD/CD priced &nbsp;·&nbsp;\n          <strong style=\"color:#9ca3af;\">Speculative<\u002Fstrong> — early design / 3rd party &nbsp;·&nbsp;\n          <strong style=\"color:#6b7280;\">Industry<\u002Fstrong> — external dataset\n        <\u002Fdiv>\n\n        <div style=\"margin-top:14px;\">\n          <label class=\"outlier-toggle\" id=\"editOutlierToggle\">\n            <input type=\"checkbox\" name=\"isOutlier\" id=\"editOutlierCheck\">\n            Flag as outlier (excluded from benchmark averages, shown with disclaimer)\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <div class=\"section-head\" style=\"margin-top:18px;\">Add / Update Milestone<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n          <div class=\"form-group\"><label>Milestone<\u002Flabel>\n            <select name=\"milestoneName\"><option value=\"\">None<\u002Foption><option value=\"DD\">DD<\u002Foption><option value=\"CD\">CD/GMP<\u002Foption><option value=\"Final\">Final/Actual<\u002Foption><\u002Fselect>\n          <\u002Fdiv>\n          <div class=\"form-group\"><label>Date<\u002Flabel><input type=\"date\" name=\"milestoneDate\"><\u002Fdiv>\n          <div class=\"form-group\"><label>Gross Cost $/SF<\u002Flabel><input type=\"number\" step=\".01\" name=\"grossSF\"><\u002Fdiv>\n          <div class=\"form-group\"><label>Gross Cost $/Unit<\u002Flabel><input type=\"number\" step=\".01\" name=\"grossUnit\"><\u002Fdiv>\n          <div class=\"form-group\"><label>OH&amp;P ($)<\u002Flabel><input type=\"number\" step=\".01\" name=\"milestoneOhp\" placeholder=\"0\"><\u002Fdiv>\n          <div class=\"form-group\"><label>Sitework ($)<\u002Flabel><input type=\"number\" step=\".01\" name=\"milestoneSitework\" placeholder=\"0\"><\u002Fdiv>\n          <div class=\"form-group\"><label>Insurance ($)<\u002Flabel><input type=\"number\" step=\".01\" name=\"milestoneInsurance\" placeholder=\"0\"><\u002Fdiv>\n          <div class=\"form-group\"><label>Sub Bond ($)<\u002Flabel><input type=\"number\" step=\".01\" name=\"milestoneBond\" placeholder=\"0\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:16px;\">\n          <button type=\"submit\" class=\"primary\">Save Changes<\u002Fbutton>\n          <button type=\"button\" class=\"secondary\" onclick=\"closeModal('editModal')\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n// ─────────────────────────────────────────────\n// CONSTANTS\n// ─────────────────────────────────────────────\nconst TYPE_COLORS = {\n  'multi-family-podium':     '#E05450',\n  'multi-family-non-podium': '#4CAF50',\n  'healthcare':              '#2196F3',\n  'commercial':              '#FF9800',\n  'parking':                 '#9C27B0',\n  'research':                '#00BCD4',\n  '':                        '#888888'\n};\n\nconst TYPE_LABELS = {\n  'multi-family-podium':     'MF Podium',\n  'multi-family-non-podium': 'MF Non-Podium',\n  'healthcare':              'Healthcare',\n  'commercial':              'Commercial',\n  'parking':                 'Parking',\n  'research':                'Research',\n  '':                        'Unspecified'\n};\n\n// RSMeans CT 2024 base values $/SF\nconst RS_MEANS_2024 = {\n  'multi-family-podium':     254,\n  'multi-family-non-podium': 211,\n  'healthcare':              524,\n  'commercial':              227,\n  'parking':                 103,\n  'research':                454\n};\n\nconst BASE_YEAR = 2024;\n\n// Turner Construction Cost Index (national, annual avg approximations)\n// Source: Turner Building Cost Index quarterly reports\nconst TURNER_CCI = {\n  2012:790, 2013:829, 2014:878, 2015:909, 2016:935, 2017:971,\n  2018:1037, 2019:1072, 2020:1080, 2021:1162, 2022:1318,\n  2023:1391, 2024:1449, 2025:1493, 2026:1538, 2027:1585,\n  2028:1632, 2029:1681, 2030:1731, 2031:1783, 2032:1836\n};\nconst TURNER_BASE = TURNER_CCI[BASE_YEAR]; // 1449\n\nfunction turnerMultiplier(year) {\n  const y = Math.round(year);\n  const cci = TURNER_CCI[y];\n  if (!cci) {\n    // extrapolate at ~3% for years beyond table\n    return (TURNER_CCI[2032] / TURNER_BASE) * Math.pow(1.03, y - 2032);\n  }\n  return cci / TURNER_BASE;\n}\n\n// RSMeans CT escalation: 4.5%/yr from 2024 base\nfunction rsMeansMultiplier(year) {\n  return Math.pow(1.045, year - BASE_YEAR);\n}\n\n// Averaged index: RSMeans CT + Turner CCI\nfunction avgIndexEscalated(type, year) {\n  const base = RS_MEANS_2024[type];\n  if (!base) return null;\n  const rm = base * rsMeansMultiplier(year);\n  const tc = base * turnerMultiplier(year);\n  return (rm + tc) / 2;\n}\n\nconst RELIABILITY_ALPHA = {\n  confirmed:   1.0,\n  reliable:    0.65,\n  speculative: 0.28,\n  industry:    0.15\n};\n\nconst RELIABILITY_LABELS = {\n  confirmed:   'Confirmed (Built / Actual)',\n  reliable:    'Reliable (DD/CD Priced)',\n  speculative: 'Speculative (Early Design / 3rd Party)',\n  industry:    'Industry Dataset'\n};\n\nconst CSI_LABELS = {\n  csi01:'Div 01 — General Requirements',\n  csi03:'Div 03 — Concrete',\n  csi04:'Div 04 — Masonry',\n  csi05:'Div 05 — Metals',\n  csi06:'Div 06 — Wood & Plastics',\n  csi07:'Div 07 — Thermal & Moisture',\n  csi08:'Div 08 — Openings',\n  csi09:'Div 09 — Finishes',\n  csi14:'Div 14 — Conveying Equipment',\n  csi21:'Div 21-22 — Fire/Plumbing',\n  csi23:'Div 23 — HVAC',\n  csi26:'Div 26 — Electrical'\n};\n\n// ─────────────────────────────────────────────\n// SEED DATA\n// ─────────────────────────────────────────────\nconst SEED_DATA = [\n  {id:'1',projectName:'Cadence on Canal',location:'New Haven',businessLine:'investment',projectType:'multi-family-podium',constructionType:'type-5',squareFootage:183520,units:176,costPerSF:277.98,costPerUnit:289858.51,adjustedCostPerSF:253.34,adjustedCostPerUnit:264162.36,date:'2025-01-28',source:'RJDA',notes:'Built project — actual cost',reliabilityTier:'confirmed',isOutlier:false,\n    csi:{csi01:18.2,csi03:42.1,csi05:22.4,csi07:28.6,csi08:24.3,csi09:38.7,csi21:19.8,csi23:31.2,csi26:26.4}},\n  {id:'2',projectName:'The Beam',location:'New London',businessLine:'investment',projectType:'multi-family-non-podium',constructionType:'type-3',squareFootage:183125,units:203,costPerSF:213.32,costPerUnit:192435.20,adjustedCostPerSF:198.83,adjustedCostPerUnit:179365.28,date:'2023-09-01',source:'RJDA',notes:'Built project — actual cost',reliabilityTier:'confirmed',isOutlier:false,\n    csi:{csi01:14.1,csi03:31.2,csi05:17.8,csi07:21.4,csi08:19.6,csi09:29.8,csi21:16.2,csi23:24.6,csi26:20.1}},\n  {id:'3',projectName:'College & Crown',location:'New Haven',businessLine:'investment',projectType:'multi-family-podium',constructionType:'type-5',squareFootage:180000,units:160,costPerSF:220.20,costPerUnit:247719.74,adjustedCostPerSF:205.46,adjustedCostPerUnit:231137.28,date:'2014-09-01',source:'RJDA',notes:'Built project — actual cost',reliabilityTier:'confirmed',isOutlier:false},\n  {id:'4',projectName:'Ft Trumbull Parcel 3C',location:'New London',businessLine:'investment',projectType:'multi-family-podium',constructionType:'type-5',squareFootage:252230,units:250,costPerSF:292.91,costPerUnit:295524.52,adjustedCostPerSF:257.93,adjustedCostPerUnit:260229.89,date:'2029-09-01',source:'RJDA',notes:'Priced at CD/GMP',reliabilityTier:'reliable',isOutlier:false},\n  {id:'5',projectName:'Dixwell Phase 1B',location:'New Haven',businessLine:'advisory',projectType:'multi-family-podium',constructionType:'type-5',squareFootage:205629,units:184,costPerSF:349.84,costPerUnit:390964.70,adjustedCostPerSF:317.98,adjustedCostPerUnit:355361.15,date:'2027-12-31',source:'RJDA',notes:'Priced at DD documents',reliabilityTier:'reliable',isOutlier:false},\n  {id:'6',projectName:'ConnCAT HQ',location:'New Haven',businessLine:'advisory',projectType:'commercial',constructionType:'other',squareFootage:67425,units:0,costPerSF:620.12,costPerUnit:0,adjustedCostPerSF:620.12,adjustedCostPerUnit:0,date:'2026-04-30',source:'RJDA',notes:'Full DD/CD documents',reliabilityTier:'confirmed',isOutlier:false},\n  {id:'7',projectName:'Ft Trumbull Parcel 4A',location:'New London',businessLine:'investment',projectType:'parking',constructionType:'type-1',squareFootage:255914,units:1213,costPerSF:124.32,costPerUnit:26227.94,adjustedCostPerSF:97.87,adjustedCostPerUnit:20648.87,date:'2027-06-01',source:'RJDA',notes:'Priced at CD',reliabilityTier:'reliable',isOutlier:false},\n  {id:'8',projectName:'Cornell Scott RWC',location:'New Haven',businessLine:'advisory',projectType:'healthcare',constructionType:'type-2',squareFootage:29090,units:0,costPerSF:623.00,costPerUnit:0,adjustedCostPerSF:623.00,adjustedCostPerUnit:0,date:'2025-04-01',source:'RJDA',notes:'Built project — actual cost',reliabilityTier:'confirmed',isOutlier:false,\n    csi:{csi01:52.4,csi03:68.2,csi05:41.6,csi07:58.3,csi08:47.9,csi09:81.2,csi21:58.4,csi23:96.7,csi26:74.3}},\n  {id:'9',projectName:'Forest Cove Beckerman',location:'West Haven',businessLine:'deal-flow',projectType:'multi-family-podium',constructionType:'type-5',squareFootage:167500,units:168,costPerSF:292.57,costPerUnit:291700.57,adjustedCostPerSF:258.04,adjustedCostPerUnit:257272.94,date:'2029-04-01',source:'RJDA',notes:'Opportunity pricing — early design documents',reliabilityTier:'speculative',isOutlier:false},\n  {id:'10',projectName:'Polar Park',location:'Worcester',businessLine:'deal-flow',projectType:'multi-family-podium',constructionType:'type-5',squareFootage:196925,units:167,costPerSF:264.04,costPerUnit:311350.08,adjustedCostPerSF:225.26,adjustedCostPerUnit:265624.52,date:'2029-04-01',source:'RJDA',notes:'Opportunity pricing — early design documents',reliabilityTier:'speculative',isOutlier:false},\n  {id:'11',projectName:'Yale Prospect',location:'New Haven',businessLine:'deal-flow',projectType:'multi-family-non-podium',constructionType:'type-5',squareFootage:178752,units:231,costPerSF:313.06,costPerUnit:242251.72,adjustedCostPerSF:281.09,adjustedCostPerUnit:217515.49,date:'2029-04-01',source:'RJDA',notes:'Opportunity pricing — early design',reliabilityTier:'speculative',isOutlier:false},\n  {id:'12',projectName:'Ft Trumbull Parcel 1A',location:'New London',businessLine:'investment',projectType:'multi-family-podium',constructionType:'type-5',squareFootage:271838,units:250,costPerSF:255.66,costPerUnit:277991.14,adjustedCostPerSF:219.98,adjustedCostPerUnit:239191.42,date:'2027-12-31',source:'RJDA',notes:'Priced at CD',reliabilityTier:'reliable',isOutlier:false}\n];\n\n// ─────────────────────────────────────────────\n// STATE\n// ─────────────────────────────────────────────\nlet projects = [];\nlet filterState = {\n  businessLine: [],\n  projectType: [],\n  constructionType: [],\n  reliability: ['confirmed','reliable','speculative','industry'],\n  trendView: 'byType'\n};\nlet charts = {};\nlet expandedChartKey = null;\nlet editingId = null;\n\n// ─────────────────────────────────────────────\n// PERSISTENCE\n// ─────────────────────────────────────────────\nfunction loadProjects() {\n  const stored = localStorage.getItem('rjda_v7_projects');\n  projects = stored ? JSON.parse(stored) : SEED_DATA.map(p => ({...p}));\n  if (!stored) saveProjects();\n}\nfunction saveProjects() { localStorage.setItem('rjda_v7_projects', JSON.stringify(projects)); }\n\n// ─────────────────────────────────────────────\n// LOGO\n// ─────────────────────────────────────────────\nfunction injectLogo() {\n  const iconUrl = (window.__resources && window.__resources.rjciIcon) ? window.__resources.rjciIcon : 'rjci-icon.png';\n  const wrap = document.getElementById('logoWrap');\n  wrap.innerHTML = `<img src=\"${iconUrl}\" alt=\"RJDA\" style=\"height:40px;width:auto;flex-shrink:0;\">`;\n\n  const R = window.__resources || {};\n  const icon512 = R.rjciIcon512 || 'rjci-icon-512.png';\n  const icon192 = R.rjciIcon192 || 'rjci-icon-192.png';\n  const icon512m = R.rjciIcon512Mask || 'rjci-icon-512-maskable.png';\n  const icon192m = R.rjciIcon192Mask || 'rjci-icon-192-maskable.png';\n\n  // Build the web-app manifest dynamically so its icon paths resolve correctly\n  // both in the live project (relative file) and the bundled standalone export\n  // (blob/data URL) — a static data-URI manifest can't reference either.\n  // Icons are real square PNGs at the declared pixel sizes (mismatched\n  // declared-vs-actual dimensions is why Android was rejecting the icon and\n  // falling back to the generic badge).\n  const manifest = {\n    name: 'RJDA Cost Intelligence Dashboard',\n    short_name: 'RJ Cost Intel',\n    display: 'standalone',\n    background_color: '#191919',\n    theme_color: '#2D2D2D',\n    icons: [\n      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },\n      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },\n      { src: icon192m, sizes: '192x192', type: 'image/png', purpose: 'maskable' },\n      { src: icon512m, sizes: '512x512', type: 'image/png', purpose: 'maskable' }\n    ]\n  };\n  const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});\n  const manifestUrl = URL.createObjectURL(manifestBlob);\n  let link = document.querySelector('link[rel=\"manifest\"]');\n  if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }\n  link.href = manifestUrl;\n}\n\n// ─────────────────────────────────────────────\n// FILTERS — build UI\n// ─────────────────────────────────────────────\nfunction buildFilters() {\n  const bar = document.getElementById('filterBar');\n  bar.innerHTML = `\n    <div class=\"fb-group\">\n      <div class=\"fb-label\">Business Line<\u002Fdiv>\n      <div class=\"ms-wrap\" id=\"ms-businessLine\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fb-sep\"><\u002Fdiv>\n    <div class=\"fb-group\">\n      <div class=\"fb-label\">Project Type<\u002Fdiv>\n      <div class=\"ms-wrap\" id=\"ms-projectType\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fb-sep\"><\u002Fdiv>\n    <div class=\"fb-group\">\n      <div class=\"fb-label\">Const. Type<\u002Fdiv>\n      <div class=\"ms-wrap\" id=\"ms-constructionType\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fb-sep\"><\u002Fdiv>\n    <div class=\"fb-group\">\n      <div class=\"fb-label\">Trend View<\u002Fdiv>\n      <select id=\"trendViewSel\" style=\"padding:5px 10px;background:var(--muted);border:1px solid var(--border);border-radius:5px;font-size:12px;color:var(--fg);\" onchange=\"filterState.trendView=this.value;renderCharts()\">\n        <option value=\"byType\">By Project Type<\u002Foption>\n        <option value=\"rjdaVsComp\">RJDA vs Competitors<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"fb-sep\"><\u002Fdiv>\n    <div class=\"fb-group\">\n      <div class=\"fb-label\">Reliability<\u002Fdiv>\n      <div class=\"rel-pills\">\n        <div class=\"rel-pill confirmed active\" data-rel=\"confirmed\" onclick=\"toggleReliabilityFilter('confirmed',this)\"><span class=\"rel-dot\"><\u002Fspan>Confirmed<\u002Fdiv>\n        <div class=\"rel-pill reliable active\" data-rel=\"reliable\" onclick=\"toggleReliabilityFilter('reliable',this)\"><span class=\"rel-dot\"><\u002Fspan>Reliable<\u002Fdiv>\n        <div class=\"rel-pill speculative active\" data-rel=\"speculative\" onclick=\"toggleReliabilityFilter('speculative',this)\"><span class=\"rel-dot\"><\u002Fspan>Speculative<\u002Fdiv>\n        <div class=\"rel-pill industry active\" data-rel=\"industry\" onclick=\"toggleReliabilityFilter('industry',this)\"><span class=\"rel-dot\"><\u002Fspan>Industry<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  buildMultiSelect('ms-businessLine','businessLine',[\n    {v:'advisory',l:'Advisory'},{v:'investment',l:'Investment'},{v:'deal-flow',l:'Deal Flow'},{v:'competitor',l:'Competitor'}\n  ]);\n  buildMultiSelect('ms-projectType','projectType',[\n    {v:'multi-family-podium',l:'MF Podium'},{v:'multi-family-non-podium',l:'MF Non-Podium'},\n    {v:'healthcare',l:'Healthcare'},{v:'research',l:'Research'},\n    {v:'parking',l:'Parking'},{v:'commercial',l:'Commercial'}\n  ]);\n  buildMultiSelect('ms-constructionType','constructionType',[\n    {v:'type-1',l:'Type 1'},{v:'type-2',l:'Type 2'},{v:'type-3',l:'Type 3'},\n    {v:'type-4',l:'Type 4'},{v:'type-5',l:'Type 5'}\n  ]);\n}\n\nfunction buildMultiSelect(containerId, key, options) {\n  const wrap = document.getElementById(containerId);\n  const btn = document.createElement('div');\n  btn.className = 'ms-btn';\n  btn.id = 'msBtn-'+key;\n  btn.innerHTML = `<span id=\"msBtnLabel-${key}\">All<\u002Fspan><span class=\"ms-arrow\">▾<\u002Fspan>`;\n  btn.onclick = (e) => { e.stopPropagation(); toggleDropdown(key); };\n\n  const dd = document.createElement('div');\n  dd.className = 'ms-dropdown';\n  dd.id = 'msDd-'+key;\n  dd.innerHTML = options.map(o => `\n    <div class=\"ms-item\" onclick=\"toggleMsOption('${key}','${o.v}',this)\">\n      <input type=\"checkbox\" id=\"ms-${key}-${o.v}\" ${filterState[key].includes(o.v)?'checked':''}>\n      <label for=\"ms-${key}-${o.v}\" style=\"cursor:pointer\">${o.l}<\u002Flabel>\n    <\u002Fdiv>\n  `).join('') + `<div class=\"ms-clear\" onclick=\"clearMsFilter('${key}')\">Clear all<\u002Fdiv>`;\n\n  wrap.appendChild(btn);\n  wrap.appendChild(dd);\n}\n\nfunction toggleDropdown(key) {\n  document.querySelectorAll('.ms-dropdown').forEach(d => {\n    if (d.id !== 'msDd-'+key) d.classList.remove('open');\n  });\n  document.getElementById('msDd-'+key).classList.toggle('open');\n}\n\ndocument.addEventListener('click', () => {\n  document.querySelectorAll('.ms-dropdown').forEach(d => d.classList.remove('open'));\n});\n\nfunction toggleMsOption(key, val, itemEl) {\n  const cb = itemEl.querySelector('input[type=checkbox]');\n  cb.checked = !cb.checked;\n  const arr = filterState[key];\n  if (cb.checked) { if (!arr.includes(val)) arr.push(val); }\n  else { const i = arr.indexOf(val); if (i >= 0) arr.splice(i,1); }\n  updateMsBtnLabel(key);\n  applyFilters();\n}\n\nfunction clearMsFilter(key) {\n  filterState[key] = [];\n  document.querySelectorAll(`#msDd-${key} input[type=checkbox]`).forEach(cb => cb.checked = false);\n  updateMsBtnLabel(key);\n  applyFilters();\n}\n\nfunction updateMsBtnLabel(key) {\n  const arr = filterState[key];\n  const lbl = document.getElementById('msBtnLabel-'+key);\n  const btn = document.getElementById('msBtn-'+key);\n  if (!arr.length) { lbl.textContent='All'; btn.classList.remove('has-selection'); }\n  else { lbl.textContent = arr.length+' selected'; btn.classList.add('has-selection'); }\n}\n\nfunction toggleReliabilityFilter(tier, el) {\n  el.classList.toggle('active');\n  const arr = filterState.reliability;\n  const i = arr.indexOf(tier);\n  if (i >= 0) arr.splice(i,1); else arr.push(tier);\n  applyFilters();\n}\n\n// ─────────────────────────────────────────────\n// FILTER + METRICS\n// ─────────────────────────────────────────────\nfunction getFiltered() {\n  return projects.filter(p => {\n    if (filterState.businessLine.length && !filterState.businessLine.includes(p.businessLine)) return false;\n    if (filterState.projectType.length && !filterState.projectType.includes(p.projectType)) return false;\n    if (filterState.constructionType.length && !filterState.constructionType.includes(p.constructionType)) return false;\n    if (!filterState.reliability.includes(p.reliabilityTier || 'speculative')) return false;\n    return true;\n  });\n}\n\nfunction applyFilters() { renderMetrics(); renderCharts(); }\n\nfunction renderMetrics() {\n  const fp = getFiltered();\n  const nonOutlier = fp.filter(p => !p.isOutlier);\n  const withSF = nonOutlier.filter(p => p.costPerSF);\n  const withUnit = nonOutlier.filter(p => p.costPerUnit && p.units);\n  const avg = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : 0;\n\n  const avgSF    = avg(withSF.map(p=>p.costPerSF));\n  const avgAdjSF = avg(withSF.filter(p=>p.adjustedCostPerSF).map(p=>p.adjustedCostPerSF));\n  const avgUnit     = avg(withUnit.map(p=>p.costPerUnit));\n  const avgAdjUnit  = avg(withUnit.filter(p=>p.adjustedCostPerUnit).map(p=>p.adjustedCostPerUnit));\n\n  const hasOutliers = fp.some(p=>p.isOutlier);\n  const confirmedCount = fp.filter(p=>p.reliabilityTier==='confirmed').length;\n  const reliableCount  = fp.filter(p=>p.reliabilityTier==='reliable').length;\n  const specCount      = fp.filter(p=>['speculative','industry'].includes(p.reliabilityTier)).length;\n\n  document.getElementById('metricsStrip').innerHTML = `\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Projects Shown<\u002Fdiv>\n      <div class=\"metric-value\">${fp.length}<\u002Fdiv>\n      <div class=\"metric-sub\">${hasOutliers?'<span style=\"color:#fbbf24\">⚠ '+fp.filter(p=>p.isOutlier).length+' outlier(s) excl.<\u002Fspan>':''}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Avg Cost Gross<\u002Fdiv>\n      <div class=\"metric-value\" style=\"color:var(--coral)\">$${avgSF?Math.round(avgSF):'—'}<\u002Fdiv>\n      <div class=\"metric-sub\">per SF<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Avg Cost Adjusted<\u002Fdiv>\n      <div class=\"metric-value\">$${avgAdjSF?Math.round(avgAdjSF):'—'}<\u002Fdiv>\n      <div class=\"metric-sub\">per SF · excl. outliers<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Avg Cost/Unit Gross<\u002Fdiv>\n      <div class=\"metric-value\">$${avgUnit?Math.round(avgUnit).toLocaleString():'—'}<\u002Fdiv>\n      <div class=\"metric-sub\">per unit<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Avg Cost/Unit Adjusted<\u002Fdiv>\n      <div class=\"metric-value\">$${avgAdjUnit?Math.round(avgAdjUnit).toLocaleString():'—'}<\u002Fdiv>\n      <div class=\"metric-sub\">per unit · excl. outliers<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-card\">\n      <div class=\"metric-label\">Data Quality Mix<\u002Fdiv>\n      <div class=\"metric-value\" style=\"font-size:14px;margin-top:4px;display:flex;gap:6px;align-items:center;\">\n        <span style=\"color:#f87171;font-size:12px;font-weight:700\">${confirmedCount} conf.<\u002Fspan>\n        <span style=\"color:#fbbf24;font-size:12px;font-weight:700\">${reliableCount} rel.<\u002Fspan>\n        <span style=\"color:#9ca3af;font-size:12px;font-weight:700\">${specCount} spec.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"metric-sub\">reliability breakdown<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\n// ─────────────────────────────────────────────\n// CHART HELPERS\n// ─────────────────────────────────────────────\nfunction hexToRgba(hex, alpha) {\n  const r = parseInt(hex.slice(1,3),16);\n  const g = parseInt(hex.slice(3,5),16);\n  const b = parseInt(hex.slice(5,7),16);\n  return `rgba(${r},${g},${b},${alpha})`;\n}\n\nfunction reliabilityAlpha(tier) { return RELIABILITY_ALPHA[tier] || 0.3; }\n\nfunction linearRegression(pts) {\n  // pts = [{x, y}]\n  const n = pts.length;\n  if (n < 2) return null;\n  const sx = pts.reduce((s,p)=>s+p.x,0);\n  const sy = pts.reduce((s,p)=>s+p.y,0);\n  const sxy = pts.reduce((s,p)=>s+p.x*p.y,0);\n  const sx2 = pts.reduce((s,p)=>s+p.x*p.x,0);\n  const denom = n*sx2 - sx*sx;\n  if (!denom) return null;\n  const m = (n*sxy - sx*sy)/denom;\n  const b = (sy - m*sx)/n;\n  return {m,b};\n}\n\nfunction dateToYear(dateStr) {\n  if (!dateStr) return null;\n  const d = new Date(dateStr+'T00:00:00');\n  return d.getFullYear() + (d.getMonth()/12);\n}\n\n// ─────────────────────────────────────────────\n// COST DISTRIBUTION CHART\n// ─────────────────────────────────────────────\nfunction buildCostChartConfig(fp, onClickFn) {\n  const sorted = [...fp].filter(p=>p.costPerSF).sort((a,b)=>b.costPerSF-a.costPerSF);\n  const labels = sorted.map(p => p.projectName.length > 18 ? p.projectName.slice(0,16)+'…' : p.projectName);\n  const fullNames = sorted.map(p => p.projectName);\n\n  const colors = sorted.map(p => {\n    const base = TYPE_COLORS[p.projectType||''] || '#888';\n    return hexToRgba(base, reliabilityAlpha(p.reliabilityTier||'speculative'));\n  });\n  const borders = sorted.map(p => {\n    const base = TYPE_COLORS[p.projectType||''] || '#888';\n    return hexToRgba(base, Math.min(1, reliabilityAlpha(p.reliabilityTier||'speculative') + 0.2));\n  });\n  const borderDash = sorted.map(p => p.reliabilityTier === 'speculative' || p.reliabilityTier === 'industry' ? [4,3] : []);\n\n  return {\n    type: 'bar',\n    data: {\n      labels,\n      datasets: [{\n        label: 'Cost $/SF',\n        data: sorted.map(p => Math.round(p.costPerSF)),\n        backgroundColor: colors,\n        borderColor: borders,\n        borderWidth: sorted.map(p => p.isOutlier ? 2 : 1),\n        borderSkipped: false\n      }]\n    },\n    options: {\n      responsive: true, maintainAspectRatio: false,\n      onClick: (e, elements) => { if (elements.length && onClickFn) onClickFn(sorted[elements[0].index].id); },\n      plugins: {\n        legend: { display: false },\n        tooltip: {\n          callbacks: {\n            title: (items) => fullNames[items[0].dataIndex],\n            label: (item) => {\n              const p = sorted[item.dataIndex];\n              const tier = RELIABILITY_LABELS[p.reliabilityTier] || '';\n              const outlierNote = p.isOutlier ? ' ⚠ OUTLIER' : '';\n              return [`$${item.parsed.y.toLocaleString()}/SF`, tier + outlierNote, p.projectType ? p.projectType.replace(/-/g,' ') : ''];\n            }\n          }\n        }\n      },\n      scales: {\n        x: { ticks: { font: {size:10}, maxRotation:45 } },\n        y: { beginAtZero:false, ticks: { callback: v=>'$'+v } }\n      }\n    }\n  };\n}\n\n// ─────────────────────────────────────────────\n// TREND SCATTER CHART\n// ─────────────────────────────────────────────\nfunction buildTrendChartConfig(fp, onClickFn) {\n  const valid = fp.filter(p => p.costPerSF && p.date);\n  const datasets = [];\n  const projectMap = {};\n  valid.forEach(p => projectMap[p.id] = p);\n\n  const trendView = filterState.trendView;\n  const YEARS = [];\n  for (let y = 2012; y <= 2032; y++) YEARS.push(y);\n\n  if (trendView === 'byType') {\n    const types = [...new Set(valid.map(p => p.projectType||''))].sort();\n    types.forEach(type => {\n      const color = TYPE_COLORS[type] || '#888';\n      const pts = valid.filter(p => (p.projectType||'') === type);\n      const nonOutlierPts = pts.filter(p => !p.isOutlier);\n      const label = TYPE_LABELS[type] || type;\n\n      // Scatter points — per reliability tier\n      ['confirmed','reliable','speculative','industry'].forEach(tier => {\n        const tierPts = pts.filter(p => (p.reliabilityTier||'speculative') === tier);\n        if (!tierPts.length) return;\n        const alpha = reliabilityAlpha(tier);\n        datasets.push({\n          type: 'scatter',\n          label: `${label} (${tier})`,\n          data: tierPts.map(p => ({\n            x: dateToYear(p.date),\n            y: Math.round(p.costPerSF),\n            id: p.id\n          })),\n          backgroundColor: hexToRgba(color, alpha),\n          borderColor: hexToRgba(color, Math.min(1, alpha + 0.3)),\n          borderWidth: tierPts.map(p => p.isOutlier ? 2 : 1.5),\n          pointStyle: tier === 'speculative' ? 'triangle' : tier === 'industry' ? 'rect' : 'circle',\n          pointRadius: 7,\n          pointHoverRadius: 9,\n          _type: type, _tier: tier, _isScatter: true\n        });\n      });\n\n      // Regression line (non-outlier only)\n      if (nonOutlierPts.length >= 2) {\n        const regPts = nonOutlierPts.map(p => ({x: dateToYear(p.date), y: p.costPerSF}));\n        const reg = linearRegression(regPts);\n        if (reg) {\n          const xMin = Math.min(...regPts.map(p=>p.x));\n          const xMax = Math.max(...regPts.map(p=>p.x));\n          datasets.push({\n            type: 'line',\n            label: `_reg_${label}`,\n            data: [{x:xMin, y: reg.m*xMin+reg.b},{x:xMax, y: reg.m*xMax+reg.b}],\n            borderColor: hexToRgba(color, 0.6),\n            borderWidth: 2,\n            borderDash: [6,3],\n            pointRadius: 0, fill: false, tension: 0\n          });\n        }\n      }\n\n      // Averaged index escalation trajectory (RSMeans CT + Turner CCI)\n      const rm = RS_MEANS_2024[type];\n      if (rm) {\n        datasets.push({\n          type: 'line',\n          label: `Construction Index — ${label}`,\n          _indexLabel: `RSMeans CT + Turner CCI avg · ${label} · base $${rm}/SF (2024)`,\n          data: YEARS.map(y => ({x: y, y: Math.round(avgIndexEscalated(type, y))})),\n          borderColor: hexToRgba(color, 0.3),\n          borderWidth: 1.5,\n          borderDash: [10,5],\n          pointRadius: 0, fill: false, tension: 0\n        });\n      }\n    });\n  } else {\n    // RJDA vs Competitors\n    const groups = [\n      { key: 'rjda', label: 'RJDA', color: '#E05450', filter: p => p.businessLine !== 'competitor' },\n      { key: 'comp', label: 'Competitors', color: '#888888', filter: p => p.businessLine === 'competitor' }\n    ];\n    groups.forEach(g => {\n      const pts = valid.filter(g.filter);\n      const nonOutlierPts = pts.filter(p => !p.isOutlier);\n      if (!pts.length) return;\n      ['confirmed','reliable','speculative','industry'].forEach(tier => {\n        const tierPts = pts.filter(p => (p.reliabilityTier||'speculative') === tier);\n        if (!tierPts.length) return;\n        const alpha = reliabilityAlpha(tier);\n        datasets.push({\n          type: 'scatter',\n          label: `${g.label} (${tier})`,\n          data: tierPts.map(p => ({x: dateToYear(p.date), y: Math.round(p.costPerSF), id: p.id})),\n          backgroundColor: hexToRgba(g.color, alpha),\n          borderColor: hexToRgba(g.color, Math.min(1, alpha+0.3)),\n          borderWidth: 1.5,\n          pointStyle: tier === 'speculative' ? 'triangle' : 'circle',\n          pointRadius: 7, pointHoverRadius: 9, _isScatter: true\n        });\n      });\n      if (nonOutlierPts.length >= 2) {\n        const regPts = nonOutlierPts.map(p => ({x: dateToYear(p.date), y: p.costPerSF}));\n        const reg = linearRegression(regPts);\n        if (reg) {\n          const xMin = Math.min(...regPts.map(p=>p.x));\n          const xMax = Math.max(...regPts.map(p=>p.x));\n          datasets.push({\n            type:'line', label:`_reg_${g.label}`,\n            data:[{x:xMin,y:reg.m*xMin+reg.b},{x:xMax,y:reg.m*xMax+reg.b}],\n            borderColor: hexToRgba(g.color, 0.7), borderWidth:2,\n            borderDash:[6,3], pointRadius:0, fill:false, tension:0\n          });\n        }\n      }\n    });\n    // Weighted Construction Index (RSMeans CT + Turner CCI averaged)\n    const typeCounts = {};\n    valid.forEach(p => { const t=p.projectType||''; typeCounts[t]=(typeCounts[t]||0)+1; });\n    const total = Object.values(typeCounts).reduce((s,v)=>s+v,0);\n    datasets.push({\n      type:'line', label:'Construction Index (weighted avg)',\n      _indexLabel: 'Avg of RSMeans CT + Turner CCI · weighted by project type mix · base 2024',\n      data: YEARS.map(y => {\n        const val = Object.entries(typeCounts).reduce((sum,[type,count]) => {\n          const v = avgIndexEscalated(type, y);\n          return v ? sum + v*count/total : sum;\n        }, 0);\n        return {x:y, y:Math.round(val)};\n      }),\n      borderColor:'rgba(200,200,200,0.35)', borderWidth:1.5,\n      borderDash:[10,5], pointRadius:0, fill:false, tension:0\n    });\n  }\n\n  return {\n    type: 'scatter',\n    data: { datasets },\n    options: {\n      responsive: true, maintainAspectRatio: false,\n      onClick: (e, elements) => {\n        if (!elements.length || !onClickFn) return;\n        const ds = datasets[elements[0].datasetIndex];\n        const pt = ds.data[elements[0].index];\n        if (pt && pt.id) onClickFn(pt.id);\n      },\n      plugins: {\n        legend: {\n          display: true, position: 'bottom',\n          labels: {\n            filter: item => !item.text.startsWith('_reg_'),\n            boxWidth: 14, font: {size:10},\n            generateLabels: chart => {\n              const seen = new Set();\n              return chart.data.datasets.flatMap((ds,i) => {\n                if (ds.label.startsWith('_reg_')) return [];\n                const tier = ds._tier || '';\n                const key = ds.label;\n                if (seen.has(key)) return [];\n                seen.add(key);\n                return [{\n                  text: ds.label,\n                  fillStyle: ds.backgroundColor || ds.borderColor,\n                  strokeStyle: ds.borderColor,\n                  lineWidth: 1,\n                  datasetIndex: i,\n                  fontColor: '#ccc'\n                }];\n              });\n            }\n          }\n        },\n        tooltip: {\n          callbacks: {\n            label: (item) => {\n              const ds = item.dataset;\n              const pt = item.raw;\n              // Index/benchmark lines\n              if (ds._indexLabel) {\n                return [`$${pt.y}/SF (${Math.round(pt.x)})`, ds._indexLabel];\n              }\n              // Regression lines\n              if (ds.label && ds.label.startsWith('_reg_')) return null;\n              // Scatter project points\n              const p = projects.find(pr => pr.id === pt.id);\n              if (!p) return `$${pt.y}/SF`;\n              const tier = RELIABILITY_LABELS[p.reliabilityTier] || '';\n              const outlier = p.isOutlier ? ' ⚠ OUTLIER' : '';\n              return [p.projectName, `$${Math.round(p.costPerSF)}/SF`, tier+outlier, p.location];\n            }\n          }\n        }\n      },\n      scales: {\n        x: { type:'linear', title:{display:true,text:'Year'}, ticks:{stepSize:1, callback:v=>Math.round(v)===v?v:''}, min:2012, max:2032 },\n        y: { beginAtZero:false, title:{display:true,text:'$/SF'}, ticks:{callback:v=>'$'+v} }\n      }\n    }\n  };\n}\n\n// ─────────────────────────────────────────────\n// RENDER\n// ─────────────────────────────────────────────\nfunction renderCharts() {\n  const fp = getFiltered();\n  if (charts.cost) { charts.cost.destroy(); charts.cost = null; }\n  if (charts.trend) { charts.trend.destroy(); charts.trend = null; }\n\n  const costCtx = document.getElementById('costChart').getContext('2d');\n  charts.cost = new Chart(costCtx, buildCostChartConfig(fp, showDetail));\n\n  const trendCtx = document.getElementById('trendChart').getContext('2d');\n  charts.trend = new Chart(trendCtx, buildTrendChartConfig(fp, showDetail));\n}\n\nfunction renderAll() { renderMetrics(); renderCharts(); renderProjectsTable(); }\n\n// ─────────────────────────────────────────────\n// CHART EXPAND\n// ─────────────────────────────────────────────\nfunction expandChart(key) {\n  expandedChartKey = key;\n  const modal = document.getElementById('chartModal');\n  const titleEl = document.getElementById('chartModalTitle');\n  const fp = getFiltered();\n  titleEl.textContent = key === 'cost' ? 'Cost Distribution $/SF' : 'Cost Trends & Escalation';\n\n  modal.classList.add('active');\n  setTimeout(() => {\n    if (charts.expanded) { charts.expanded.destroy(); charts.expanded = null; }\n    const ctx = document.getElementById('expandedChart').getContext('2d');\n    const config = key === 'cost'\n      ? buildCostChartConfig(fp, id => { closeModal('chartModal'); showDetail(id); })\n      : buildTrendChartConfig(fp, id => { closeModal('chartModal'); showDetail(id); });\n    charts.expanded = new Chart(ctx, config);\n  }, 80);\n}\n\n// ─────────────────────────────────────────────\n// PROJECT DETAIL MODAL\n// ─────────────────────────────────────────────\nfunction showDetail(id) {\n  const p = projects.find(x=>x.id===id);\n  if (!p) return;\n\n  const tierColor = {confirmed:'#f87171',reliable:'#fbbf24',speculative:'#9ca3af',industry:'#6b7280'};\n  const tc = tierColor[p.reliabilityTier] || '#9ca3af';\n\n  const csiEntries = p.csi ? Object.entries(p.csi).filter(([k,v])=>v>0) : [];\n  const csiHtml = csiEntries.length ? `\n    <div class=\"section-head\">CSI Division Breakdown<\u002Fdiv>\n    <div class=\"csi-grid\">\n      ${csiEntries.map(([k,v])=>`\n        <div class=\"csi-item\">\n          <div class=\"csi-div\">${CSI_LABELS[k]||k}<\u002Fdiv>\n          <div class=\"csi-val\">$${v.toFixed(2)}/SF<\u002Fdiv>\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>\n  ` : '';\n\n  const milestonesHtml = p.milestones && p.milestones.length ? `\n    <div class=\"section-head\">Milestone History<\u002Fdiv>\n    <table><thead><tr><th>Milestone<\u002Fth><th>Date<\u002Fth><th>Gross $/SF<\u002Fth><th>Adj $/SF<\u002Fth><th>Gross $/Unit<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>${p.milestones.map(m=>`<tr>\n      <td>${m.name}<\u002Ftd><td>${new Date(m.date).toLocaleDateString()}<\u002Ftd>\n      <td>$${m.grossSF?Math.round(m.grossSF):'-'}<\u002Ftd>\n      <td>$${m.adjSF?Math.round(m.adjSF):'-'}<\u002Ftd>\n      <td>${m.grossUnit?'$'+Math.round(m.grossUnit).toLocaleString():'-'}<\u002Ftd>\n    <\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>\n  ` : '';\n\n  const outlierBanner = p.isOutlier ? `<div class=\"outlier-banner\">⚠ This project is flagged as an outlier and is excluded from benchmark averages.<\u002Fdiv>` : '';\n\n  document.getElementById('detailTitle').textContent = p.projectName;\n  document.getElementById('detailBody').innerHTML = `\n    ${outlierBanner}\n    <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;\">\n      <span class=\"badge ${p.businessLine||''}\">${p.businessLine||'—'}<\u002Fspan>\n      <span class=\"badge type-${p.projectType||'unspecified'}\">${(p.projectType||'unspecified').replace(/-/g,' ')}<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:${tc};\">● ${RELIABILITY_LABELS[p.reliabilityTier]||''}<\u002Fspan>\n      <span style=\"font-size:12px;color:var(--muted-fg)\">${p.location}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"detail-grid\">\n      <div class=\"detail-stat\">\n        <div class=\"detail-stat-label\">Gross Cost $/SF<\u002Fdiv>\n        <div class=\"detail-stat-value\">$${p.costPerSF?Math.round(p.costPerSF).toLocaleString():'—'}<\u002Fdiv>\n        ${p.adjustedCostPerSF?`<div class=\"detail-stat-sub\">Adj: $${Math.round(p.adjustedCostPerSF).toLocaleString()}/SF<\u002Fdiv>`:''}\n      <\u002Fdiv>\n      ${p.costPerUnit&&p.units?`<div class=\"detail-stat\">\n        <div class=\"detail-stat-label\">Cost $/Unit<\u002Fdiv>\n        <div class=\"detail-stat-value\">$${Math.round(p.costPerUnit).toLocaleString()}<\u002Fdiv>\n        ${p.adjustedCostPerUnit?`<div class=\"detail-stat-sub\">Adj: $${Math.round(p.adjustedCostPerUnit).toLocaleString()}/unit<\u002Fdiv>`:''}\n      <\u002Fdiv>`:''}\n      <div class=\"detail-stat\">\n        <div class=\"detail-stat-label\">Square Footage<\u002Fdiv>\n        <div class=\"detail-stat-value\">${p.squareFootage.toLocaleString()}<\u002Fdiv>\n        <div class=\"detail-stat-sub\">SF${p.units?' · '+p.units+' units':''}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"detail-stat\">\n        <div class=\"detail-stat-label\">Date<\u002Fdiv>\n        <div class=\"detail-stat-value\" style=\"font-size:16px\">${new Date(p.date+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short'})}<\u002Fdiv>\n        <div class=\"detail-stat-sub\">${p.constructionType||''} ${p.milestone?'· '+p.milestone:''}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${p.source||p.notes?`<div class=\"section-head\">Notes<\u002Fdiv>\n    <p style=\"font-size:13px;color:var(--muted-fg);\">${[p.source?'<strong>Source:<\u002Fstrong> '+p.source:'',p.notes].filter(Boolean).join('<br>')}<\u002Fp>`:''}\n    ${csiHtml}\n    ${milestonesHtml}\n    <div style=\"margin-top:20px;display:flex;gap:10px;\">\n      <button class=\"primary btn-sm\" style=\"padding:8px 16px;\" onclick=\"closeModal('detailModal');editProject('${p.id}')\">Edit Project<\u002Fbutton>\n      <button class=\"secondary btn-sm\" style=\"padding:8px 16px;\" onclick=\"closeModal('detailModal')\">Close<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n  document.getElementById('detailModal').classList.add('active');\n}\n\n// ─────────────────────────────────────────────\n// PROJECTS TABLE\n// ─────────────────────────────────────────────\nfunction renderProjectsTable() {\n  const tierColor = {confirmed:'#f87171',reliable:'#fbbf24',speculative:'#9ca3af',industry:'#6b7280'};\n  document.getElementById('projectsBody').innerHTML = projects.map(p => `\n    <tr onclick=\"showDetail('${p.id}')\">\n      <td>${p.projectName}<\u002Ftd>\n      <td>${p.location}<\u002Ftd>\n      <td><span class=\"badge ${p.businessLine||''}\">${p.businessLine||'—'}<\u002Fspan><\u002Ftd>\n      <td><span class=\"badge type-${p.projectType||'unspecified'}\">${(p.projectType||'unspecified').replace(/-/g,' ')}<\u002Fspan><\u002Ftd>\n      <td>${p.squareFootage.toLocaleString()}<\u002Ftd>\n      <td>${p.units||'—'}<\u002Ftd>\n      <td>$${p.costPerSF?Math.round(p.costPerSF):'—'}<\u002Ftd>\n      <td>${p.costPerUnit?'$'+Math.round(p.costPerUnit).toLocaleString():'—'}<\u002Ftd>\n      <td><span style=\"font-size:11px;font-weight:700;color:${tierColor[p.reliabilityTier]||'#9ca3af'}\">● ${p.reliabilityTier||'—'}<\u002Fspan><\u002Ftd>\n      <td>${p.isOutlier?'<span style=\"color:#fbbf24;font-size:11px;\">⚠ outlier<\u002Fspan>':'—'}<\u002Ftd>\n      <td class=\"actions\" onclick=\"event.stopPropagation()\">\n        <button class=\"btn-sm btn-edit\" onclick=\"editProject('${p.id}')\">Edit<\u002Fbutton>\n        <button class=\"btn-sm btn-delete\" onclick=\"deleteProject('${p.id}')\">Delete<\u002Fbutton>\n      <\u002Ftd>\n    <\u002Ftr>\n  `).join('');\n}\n\n// ─────────────────────────────────────────────\n// EDIT PROJECT\n// ─────────────────────────────────────────────\nfunction editProject(id) {\n  editingId = id;\n  const p = projects.find(x=>x.id===id);\n  if (!p) return;\n  document.getElementById('eProjectName').value = p.projectName;\n  document.getElementById('eLocation').value = p.location;\n  document.getElementById('eBusinessLine').value = p.businessLine||'';\n  document.getElementById('eSource').value = p.source||'';\n  document.getElementById('eNotes').value = p.notes||'';\n\n  // Set reliability radio\n  document.querySelectorAll('#editReliabilitySelect input[name=reliabilityTier]').forEach(r => {\n    r.checked = r.value === (p.reliabilityTier||'speculative');\n  });\n\n  // Outlier\n  const oc = document.getElementById('editOutlierCheck');\n  oc.checked = !!p.isOutlier;\n  document.getElementById('editOutlierToggle').classList.toggle('flagged', !!p.isOutlier);\n  oc.onchange = () => document.getElementById('editOutlierToggle').classList.toggle('flagged', oc.checked);\n\n  document.getElementById('editForm').reset();\n  // re-populate after reset\n  document.getElementById('eProjectName').value = p.projectName;\n  document.getElementById('eLocation').value = p.location;\n  document.getElementById('eBusinessLine').value = p.businessLine||'';\n  document.getElementById('eSource').value = p.source||'';\n  document.getElementById('eNotes').value = p.notes||'';\n  document.querySelectorAll('#editReliabilitySelect input[name=reliabilityTier]').forEach(r => r.checked = r.value===(p.reliabilityTier||'speculative'));\n  oc.checked = !!p.isOutlier;\n\n  document.getElementById('editModal').classList.add('active');\n}\n\nfunction saveEdit(e) {\n  e.preventDefault();\n  const fd = new FormData(e.target);\n  const p = projects.find(x=>x.id===editingId);\n  if (!p) return;\n\n  p.projectName = fd.get('projectName') || p.projectName;\n  p.location = fd.get('location') || p.location;\n  p.businessLine = fd.get('businessLine') || p.businessLine;\n  p.source = fd.get('source') || p.source;\n  p.notes = fd.get('notes') || p.notes;\n  p.reliabilityTier = fd.get('reliabilityTier') || p.reliabilityTier;\n  p.isOutlier = document.getElementById('editOutlierCheck').checked;\n\n  // Milestone\n  const mName = fd.get('milestoneName');\n  const mDate = fd.get('milestoneDate');\n  const grossSF = parseFloat(fd.get('grossSF'));\n  if (mName && mDate && !isNaN(grossSF)) {\n    const grossUnit = parseFloat(fd.get('grossUnit')) || null;\n    const adj = (parseFloat(fd.get('milestoneOhp'))||0) + (parseFloat(fd.get('milestoneSitework'))||0) +\n                (parseFloat(fd.get('milestoneInsurance'))||0) + (parseFloat(fd.get('milestoneBond'))||0);\n    const adjSF = grossSF - adj/p.squareFootage;\n    const adjUnit = grossUnit && p.units ? grossUnit - adj/p.units : null;\n    if (!p.milestones) p.milestones = [];\n    p.milestones.push({name:mName, date:mDate, grossSF, adjSF, grossUnit, adjUnit});\n    p.costPerSF = grossSF;\n    p.adjustedCostPerSF = adjSF;\n    if (grossUnit) p.costPerUnit = grossUnit;\n    if (adjUnit) p.adjustedCostPerUnit = adjUnit;\n    p.date = mDate;\n  }\n\n  saveProjects();\n  renderAll();\n  closeModal('editModal');\n}\n\nfunction deleteProject(id) {\n  if (!confirm('Delete this project?')) return;\n  projects = projects.filter(p=>p.id!==id);\n  saveProjects();\n  renderAll();\n}\n\n// ─────────────────────────────────────────────\n// ADD PROJECT FORM\n// ─────────────────────────────────────────────\nfunction handleSubmit(e) {\n  e.preventDefault();\n  const fd = new FormData(e.target);\n  const sf = parseFloat(fd.get('squareFootage'));\n  const units = parseFloat(fd.get('units')) || null;\n  const method = fd.get('costMethod');\n  let costPerSF = null, costPerUnit = null;\n\n  if (method==='total') {\n    const tot = parseFloat(fd.get('totalCost'));\n    if (isNaN(tot)) { alert('Please enter Total Hard Cost.'); return; }\n    costPerSF = sf ? tot/sf : null;\n    costPerUnit = units ? tot/units : null;\n  } else if (method==='perSF') {\n    costPerSF = parseFloat(fd.get('directCostPerSF'))||null;\n    costPerUnit = costPerSF&&sf&&units ? costPerSF*sf/units : null;\n  } else {\n    costPerUnit = parseFloat(fd.get('directCostPerUnit'))||null;\n    costPerSF = costPerUnit&&units&&sf ? costPerUnit*units/sf : null;\n  }\n\n  const ohp = parseFloat(fd.get('ohp'))||0;\n  const sit = parseFloat(fd.get('sitework'))||0;\n  const lan = parseFloat(fd.get('landscape'))||0;\n  const sub = parseFloat(fd.get('subcontractorBond'))||0;\n  const ins = parseFloat(fd.get('insurance'))||0;\n  const totalAdj = ohp+sit+lan+sub+ins;\n  const adjSF = costPerSF ? costPerSF - totalAdj/sf : null;\n  const adjUnit = costPerUnit&&units ? costPerUnit - totalAdj/units : null;\n\n  const csi = {};\n  ['csi01','csi03','csi04','csi05','csi06','csi07','csi08','csi09','csi14','csi21','csi23','csi26'].forEach(k => {\n    const v = parseFloat(fd.get(k));\n    if (v>0) csi[k] = v;\n  });\n\n  const project = {\n    id: Date.now().toString(),\n    projectName: fd.get('projectName'),\n    location: fd.get('location'),\n    businessLine: fd.get('businessLine')||'',\n    projectType: fd.get('projectType')||'',\n    constructionType: fd.get('constructionType')||'',\n    squareFootage: sf, units,\n    costPerSF, costPerUnit,\n    adjustedCostPerSF: adjSF, adjustedCostPerUnit: adjUnit,\n    date: fd.get('date'),\n    source: fd.get('source')||'',\n    builder: fd.get('builder')||'',\n    notes: fd.get('notes')||'',\n    milestone: fd.get('milestone')||'',\n    reliabilityTier: fd.get('reliabilityTier')||'speculative',\n    isOutlier: !!fd.get('isOutlier'),\n    csi: Object.keys(csi).length ? csi : null\n  };\n\n  projects.push(project);\n  saveProjects();\n  e.target.reset();\n  document.getElementById('derivedDisplay').style.display='none';\n  document.getElementById('adjFields').style.display='none';\n  renderAll();\n  switchTab('dashboardTab');\n}\n\n// ─────────────────────────────────────────────\n// FORM HELPERS\n// ─────────────────────────────────────────────\nfunction switchCostMethod() {\n  const m = document.querySelector('[name=costMethod]:checked')?.value||'total';\n  document.getElementById('costInputTotal').style.display = m==='total'?'block':'none';\n  document.getElementById('costInputPerSF').style.display = m==='perSF'?'block':'none';\n  document.getElementById('costInputPerUnit').style.display = m==='perUnit'?'block':'none';\n  recalcDerived();\n}\n\nfunction toggleAdj() {\n  const v = document.querySelector('[name=isAdjusted]:checked')?.value;\n  document.getElementById('adjFields').style.display = v==='yes'?'block':'none';\n}\n\nfunction recalcDerived() {\n  const m = document.querySelector('[name=costMethod]:checked')?.value||'total';\n  const sf = parseFloat(document.getElementById('addSF')?.value)||0;\n  const units = parseFloat(document.getElementById('addUnits')?.value)||0;\n  let perSF=null, perUnit=null, total=null;\n  if (m==='total') {\n    total = parseFloat(document.getElementById('inputTotalCost')?.value)||0;\n    if(total&&sf) perSF=total/sf;\n    if(total&&units) perUnit=total/units;\n  } else if (m==='perSF') {\n    perSF = parseFloat(document.getElementById('inputDirectSF')?.value)||0;\n    if(perSF&&sf) total=perSF*sf;\n    if(total&&units) perUnit=total/units;\n  } else {\n    perUnit = parseFloat(document.getElementById('inputDirectUnit')?.value)||0;\n    if(perUnit&&units) total=perUnit*units;\n    if(total&&sf) perSF=total/sf;\n  }\n  const display = document.getElementById('derivedDisplay');\n  if (perSF||perUnit||total) {\n    document.getElementById('calcSF').textContent = perSF?'$'+Math.round(perSF).toLocaleString()+'/SF':'—';\n    document.getElementById('calcUnit').textContent = perUnit?'$'+Math.round(perUnit).toLocaleString()+'/unit':'—';\n    document.getElementById('calcTotal').textContent = total?'$'+Math.round(total).toLocaleString():'—';\n    display.style.display='block';\n  } else display.style.display='none';\n}\n\nfunction resetAddForm() {\n  document.getElementById('projectForm').reset();\n  document.getElementById('derivedDisplay').style.display='none';\n  document.getElementById('adjFields').style.display='none';\n}\n\nfunction toggleCollapsible(headEl) {\n  const body = headEl.nextElementSibling;\n  const arrow = headEl.querySelector('span');\n  body.classList.toggle('open');\n  if(arrow) arrow.textContent = body.classList.contains('open')?'▾':'▸';\n}\n\n// ─────────────────────────────────────────────\n// TAB SWITCHING\n// ─────────────────────────────────────────────\nfunction switchTab(tabId) {\n  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tabId));\n  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id===tabId));\n  // Filter bar only on dashboard\n  document.getElementById('filterBar').style.display = tabId==='dashboardTab'?'flex':'none';\n  if (tabId==='projectsTab') renderProjectsTable();\n}\n\ndocument.querySelectorAll('.tab').forEach(t => {\n  t.addEventListener('click', () => switchTab(t.dataset.tab));\n});\n\n// ─────────────────────────────────────────────\n// MODALS\n// ─────────────────────────────────────────────\nfunction closeModal(id) {\n  document.getElementById(id).classList.remove('active');\n  if (id==='chartModal' && charts.expanded) { charts.expanded.destroy(); charts.expanded=null; }\n}\n\n// ─────────────────────────────────────────────\n// INIT\n// ─────────────────────────────────────────────\ninjectLogo();\nloadProjects();\nbuildFilters();\nrenderAll();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
